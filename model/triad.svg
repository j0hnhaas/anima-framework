<svg xmlns="http://www.w3.org/2000/svg" width="600" height="360" viewBox="0 0 600 360" role="img" aria-labelledby="t d">
  <title id="t">The ANIMA triad</title>
  <desc id="d">Three nodes – AI system at the top, client at the bottom left, practitioner at the bottom right – connected by the edges C–AI, P–AI and C–P, inside a dashed frame of provider, law, institution and environment.</desc>
  <rect x="0" y="0" width="600" height="360" rx="12" fill="#ffffff"/>
  <rect x="12" y="12" width="576" height="336" rx="10" fill="none" stroke="#8c959f" stroke-width="1.2" stroke-dasharray="6 5"/>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" fill="#1f2328">
    <line x1="300" y1="44" x2="300" y2="12" stroke="#8c959f" stroke-width="1.2" stroke-dasharray="4 4"/>
    <text x="310" y="32" font-size="13" fill="#59636e">Frame–AI</text>
    <line x1="252" y1="92" x2="150" y2="218" stroke="#0f6e56" stroke-width="2"/>
    <line x1="348" y1="92" x2="450" y2="218" stroke="#0f6e56" stroke-width="2"/>
    <line x1="202" y1="244" x2="398" y2="244" stroke="#0f6e56" stroke-width="2"/>
    <text x="160" y="152" font-size="14" fill="#0f6e56" text-anchor="end">C–AI</text>
    <text x="440" y="152" font-size="14" fill="#0f6e56">P–AI</text>
    <text x="300" y="268" font-size="14" fill="#0f6e56" text-anchor="middle">C–P</text>
    <rect x="225" y="44" width="150" height="48" rx="8" fill="#e1f5ee" stroke="#0f6e56"/>
    <text x="300" y="73" font-size="15" font-weight="600" text-anchor="middle">AI system (AI)</text>
    <rect x="50" y="220" width="150" height="48" rx="8" fill="#e1f5ee" stroke="#0f6e56"/>
    <text x="125" y="249" font-size="15" font-weight="600" text-anchor="middle">Client (C)</text>
    <rect x="400" y="220" width="150" height="48" rx="8" fill="#e1f5ee" stroke="#0f6e56"/>
    <text x="475" y="249" font-size="15" font-weight="600" text-anchor="middle">Practitioner (P)</text>
    <text x="300" y="322" font-size="13" fill="#59636e" text-anchor="middle">Frame: provider · law · institution · environment</text>
  </g>
</svg>
