name: Propose a source
description: Suggest a law, guidance document or professional standard for ANIMA
title: "[Source] "
labels: ["source-proposal"]
body:
  - type: markdown
    attributes:
      value: |
        **Do not include personal or health data of identifiable people.** For sensitive reports, see [SECURITY.md](https://github.com/j0hnhaas/anima-framework/blob/main/SECURITY.md).
  - type: markdown
    attributes:
      value: |
        Thank you! Please check the [scope](https://github.com/j0hnhaas/anima-framework/blob/main/docs/scope.md) and the selection criteria in the [methodology](https://github.com/j0hnhaas/anima-framework/blob/main/docs/methodology.md).
  - type: input
    id: title
    attributes:
      label: Title of the source
      placeholder: e.g. Regulation (EU) 2024/1689 (AI Act)
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Link to the official version
    validations:
      required: true
  - type: dropdown
    id: pillar
    attributes:
      label: Pillar
      options:
        - Law – binding law
        - Guidance – WHO, public bodies, authorities
        - Professional – professional bodies of psychologists
        - Not sure
    validations:
      required: true
  - type: input
    id: jurisdiction
    attributes:
      label: Jurisdiction
      description: global, pan-European, EU or a country
      placeholder: e.g. EU, Austria, global
    validations:
      required: true
  - type: textarea
    id: relevance
    attributes:
      label: Why is this source relevant for psychology or for psychological effects of AI?
    validations:
      required: true
  - type: checkboxes
    id: edges
    attributes:
      label: Which relationships of the triad does it concern? (optional)
      description: See the [model](https://github.com/j0hnhaas/anima-framework/blob/main/model/README.md).
      options:
        - label: Client – practitioner (C–P)
        - label: Client – AI system (C–AI)
        - label: Practitioner – AI system (P–AI)
        - label: Organisation or third parties – AI system (F–AI)
  - type: checkboxes
    id: summary
    attributes:
      label: Contribution
      options:
        - label: I would like to write the source file myself
