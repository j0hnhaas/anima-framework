name: Report an error or outdated content
description: Something is wrong, outdated or unclear
title: "[Error] "
labels: ["error"]
body:
  - type: markdown
    attributes:
      value: |
        **Do not include personal or health data of identifiable people.** For sensitive reports, see [SECURITY.md](https://github.com/j0hnhaas/anima-framework/blob/main/SECURITY.md).
  - type: input
    id: location
    attributes:
      label: Where is the problem?
      description: File, section or requirement ID
      placeholder: e.g. 03-eu/README.md or ANIMA-TRANS-001
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Type of problem
      options:
        - Factual or legal error
        - Outdated (law or guidance has changed)
        - Broken link
        - Unclear wording
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What is wrong, and what would be correct?
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source for the correction
      description: Link to the official source that supports your correction
