name: REUSE compliance

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the check only needs to read the repository.
permissions:
  contents: read

jobs:
  reuse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check licence information
        uses: fsfe/reuse-action@v4
