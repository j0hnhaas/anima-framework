<!DOCTYPE html>
<html lang="{{ page.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.title != site.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <style>
    :root { --fg:#1f2328; --muted:#59636e; --bg:#ffffff; --line:#d1d9e0; --accent:#0f6e56; --code:#f6f8fa; }
    @media (prefers-color-scheme: dark) { :root { --fg:#e6edf3; --muted:#9198a1; --bg:#0d1117; --line:#30363d; --accent:#5dcaa5; --code:#161b22; } }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.65 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
    header, main, footer { max-width: 820px; margin: 0 auto; padding: 0 20px; }
    header { display:flex; flex-wrap:wrap; gap:8px 20px; align-items:baseline; padding-top:20px; padding-bottom:12px; border-bottom:1px solid var(--line); }
    header .brand { font-weight:600; color:var(--fg); text-decoration:none; margin-right:auto; }
    nav a { color:var(--muted); text-decoration:none; margin-left:16px; font-size:15px; }
    nav a:hover, a { color:var(--accent); }
    main { padding-top:16px; padding-bottom:40px; }
    h1 { font-size:1.8em; line-height:1.25; } h2 { margin-top:2em; border-bottom:1px solid var(--line); padding-bottom:.2em; }
    table { border-collapse:collapse; display:block; overflow-x:auto; margin:1em 0; }
    th, td { border:1px solid var(--line); padding:6px 12px; text-align:left; vertical-align:top; }
    code, pre { background:var(--code); border-radius:6px; font-size:.9em; }
    code { padding:.1em .35em; } pre { padding:12px 16px; overflow-x:auto; } pre code { padding:0; }
    blockquote { margin:1em 0; padding:0 1em; color:var(--muted); border-left:4px solid var(--line); }
    img { max-width:100%; height:auto; }
    footer { border-top:1px solid var(--line); padding-top:16px; padding-bottom:32px; color:var(--muted); font-size:14px; }
    footer a { color:var(--muted); }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="{{ '/' | relative_url }}">ANIMA</a>
    <nav>
      <a href="{{ '/model/' | relative_url }}">Model</a>
      <a href="{{ '/docs/scope.html' | relative_url }}">Scope</a>
      <a href="{{ '/docs/methodology.html' | relative_url }}">Methodology</a>
      <a href="{{ '/docs/glossary.html' | relative_url }}">Glossary</a>
      <a href="{{ '/docs/faq.html' | relative_url }}">FAQ</a>
      <a href="https://github.com/j0hnhaas/anima-framework">GitHub</a>
    </nav>
  </header>
  <main>
    {{ content }}
  </main>
  <footer>
    ANIMA – AI Navigator for Informed Mental Health Applications ·
    <a href="https://doi.org/10.5281/zenodo.24138892">DOI 10.5281/zenodo.24138892</a> ·
    Content licensed under <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a> ·
    <a href="{{ '/privacy.html' | relative_url }}">Privacy / Datenschutz</a>
  </footer>
  <script data-goatcounter="https://j0hnhaas.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</body>
</html>
